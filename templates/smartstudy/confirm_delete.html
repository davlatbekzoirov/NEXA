{% extends 'base/smartstudy_base.html' %}
{% block title %}Delete {{ type }} · NEXA{% endblock %}

{% block extra_head %}
<style>
  /* Page-specific responsive + polish additions only — card,
     btn-* come from base.css already. */
  .form-card{ max-width:480px; }
  @media (max-width:560px){
    .form-card{ max-width:100%; }
    .form-card .gap-2{ flex-direction:column; }
    .form-card .gap-2 a, .form-card .gap-2 button{ width:100%; text-align:center; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Delete {{ type }}</h1>
</div>
<div class="card form-card spotlight-card" data-reveal>
  <p style="font-size:15px;margin-bottom:1.5rem;">
    Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="gap-2">
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
